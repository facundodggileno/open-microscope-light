<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1050" viewBox="0 0 1650 1050"><rect width="1650" height="1050" fill="#f5f8fc"/><rect width="1650" height="100" fill="#112b45"/><text x="40" y="50" font-family="Arial,sans-serif" font-size="32" fill="#ffffff" font-weight="700" text-anchor="start">OpenMicroscope Light · Conexiones del canal LED</text><text x="40" y="80" font-family="Arial,sans-serif" font-size="18" fill="#bbd6e9" font-weight="400" text-anchor="start">Un único canal de corriente lineal reproducible | replicar 4 veces con pines específicos del MCP6004</text><rect x="38" y="127" width="1575" height="85" rx="12" fill="#fff5e8" stroke="#dfbe83" stroke-width="2"/><text x="60" y="162" font-family="Arial,sans-serif" font-size="20" fill="#794b19" font-weight="700" text-anchor="start">Recomendación: empezar con ≈170–176 mA/canal para comprobar la disipación, no copiar 350 mA sin rediseñar.</text><text x="60" y="189" font-family="Arial,sans-serif" font-size="16" fill="#8b6947" font-weight="400" text-anchor="start">Cableado de referencia — puede diferir del circuito físico en placa perforada del autor.</text><rect x="165" y="258" width="200" height="87" rx="12" fill="#eaf3fc" stroke="#87b3d4" stroke-width="2"/><text x="265" y="293" font-family="Arial,sans-serif" font-size="24" fill="#224764" font-weight="700" text-anchor="middle">+19 V DC</text><text x="265" y="321" font-family="Arial,sans-serif" font-size="17" fill="#516e82" font-weight="500" text-anchor="middle">Fuente aislada</text><rect x="618" y="258" width="250" height="87" rx="12" fill="#fff9e7" stroke="#e4bd5d" stroke-width="2"/><text x="743" y="290" font-family="Arial,sans-serif" font-size="23" fill="#775714" font-weight="700" text-anchor="middle">COB 1311-5W</text><text x="743" y="319" font-family="Arial,sans-serif" font-size="17" fill="#775714" font-weight="500" text-anchor="middle">ánodo (+) / cátodo (−)</text><path d="M365 301 L618 301" fill="none" stroke="#ce574a" stroke-width="5" stroke-linecap="round"/><text x="490" y="278" font-family="Arial,sans-serif" font-size="17" fill="#b9463b" font-weight="600" text-anchor="middle">LED positivo</text><rect x="1093" y="246" width="284" height="115" rx="12" fill="#eaf1f9" stroke="#a4b9d1" stroke-width="2"/><text x="1235" y="277" font-family="Arial,sans-serif" font-size="25" fill="#1d466a" font-weight="700" text-anchor="middle">IRLZ44N</text><text x="1235" y="307" font-family="Arial,sans-serif" font-size="18" fill="#2d5575" font-weight="500" text-anchor="middle">D → COB negativo</text><text x="1235" y="331" font-family="Arial,sans-serif" font-size="17" fill="#2d5575" font-weight="500" text-anchor="middle">S → Rshunt | G ← opamp</text><path d="M868 301 L1093 301" fill="none" stroke="#ce574a" stroke-width="5" stroke-linecap="round"/><text x="970" y="277" font-family="Arial,sans-serif" font-size="18" fill="#b9463b" font-weight="600" text-anchor="middle">DRAIN</text><rect x="1093" y="438" width="284" height="95" rx="12" fill="#edf8f0" stroke="#91bd9f" stroke-width="2"/><text x="1235" y="475" font-family="Arial,sans-serif" font-size="22" fill="#285c43" font-weight="700" text-anchor="middle">R_SENSE 1 Ω</text><text x="1235" y="501" font-family="Arial,sans-serif" font-size="16" fill="#285c43" font-weight="500" text-anchor="middle">≥0,5 W | S a GND</text><path d="M1235 361 L1235 438" fill="none" stroke="#247f52" stroke-width="5" stroke-linecap="round"/><path d="M1235 533 L1235 571" fill="none" stroke="#247f52" stroke-width="5" stroke-linecap="round"/><text x="1235" y="601" font-family="Arial,sans-serif" font-size="23" fill="#1c6042" font-weight="700" text-anchor="middle">GND ⏚</text><rect x="138" y="445" width="483" height="200" rx="12" fill="#eef3fd" stroke="#a3bad5" stroke-width="2"/><text x="380" y="480" font-family="Arial,sans-serif" font-size="25" fill="#1d4670" font-weight="700" text-anchor="middle">MCP6004 · un amplificador</text><text x="169" y="514" font-family="Arial,sans-serif" font-size="19" fill="#275882" font-weight="500" text-anchor="start">Pin (+): DIM_BUS desde SW + Rin 1 kΩ</text><text x="169" y="547" font-family="Arial,sans-serif" font-size="19" fill="#275882" font-weight="500" text-anchor="start">Pin (−): SOURCE del MOSFET, ANTES de shunt</text><text x="169" y="580" font-family="Arial,sans-serif" font-size="19" fill="#275882" font-weight="500" text-anchor="start">OUT: Gate por Rgate 1 kΩ</text><text x="169" y="619" font-family="Arial,sans-serif" font-size="19" fill="#305b80" font-weight="600" text-anchor="start">VDD pin 4 → +5 V  |  VSS pin 11 → GND</text><polyline points="621,571 755,571 755,390 1093,390" fill="none" stroke="#3570a5" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="876" y="375" font-family="Arial,sans-serif" font-size="19" fill="#326ba1" font-weight="600" text-anchor="middle">MCP6004 OUT → 1 kΩ → Gate</text><polyline points="1093,475 975,475 975,682 379,682 379,645" fill="none" stroke="#25815e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="709" y="663" font-family="Arial,sans-serif" font-size="18" fill="#257956" font-weight="600" text-anchor="middle">Retorno feedback (−) desde SOURCE</text><rect x="155" y="757" width="1360" height="187" rx="12" fill="#ffffff" stroke="#bdc9d5" stroke-width="2"/><text x="185" y="791" font-family="Arial,sans-serif" font-size="24" fill="#15496a" font-weight="700" text-anchor="start">MAPA DE PINES MCP6004 PDIP-14</text><rect x="192" y="820" width="304" height="75" rx="12" fill="#f8fafc" stroke="#d0dbe6" stroke-width="2"/><text x="210" y="850" font-family="Arial,sans-serif" font-size="19" fill="#2a4967" font-weight="700" text-anchor="start">Canal 1  (A)</text><text x="210" y="877" font-family="Arial,sans-serif" font-size="18" fill="#2a4967" font-weight="500" text-anchor="start">+ 3    − 2    OUT 1</text><rect x="521" y="820" width="304" height="75" rx="12" fill="#f3f7fd" stroke="#d0dbe6" stroke-width="2"/><text x="539" y="850" font-family="Arial,sans-serif" font-size="19" fill="#2a4967" font-weight="700" text-anchor="start">Canal 2  (B)</text><text x="539" y="877" font-family="Arial,sans-serif" font-size="18" fill="#2a4967" font-weight="500" text-anchor="start">+ 5    − 6    OUT 7</text><rect x="850" y="820" width="304" height="75" rx="12" fill="#f8fafc" stroke="#d0dbe6" stroke-width="2"/><text x="868" y="850" font-family="Arial,sans-serif" font-size="19" fill="#2a4967" font-weight="700" text-anchor="start">Canal 3  (C)</text><text x="868" y="877" font-family="Arial,sans-serif" font-size="18" fill="#2a4967" font-weight="500" text-anchor="start">+ 10    − 9    OUT 8</text><rect x="1179" y="820" width="304" height="75" rx="12" fill="#f3f7fd" stroke="#d0dbe6" stroke-width="2"/><text x="1197" y="850" font-family="Arial,sans-serif" font-size="19" fill="#2a4967" font-weight="700" text-anchor="start">Canal 4  (D)</text><text x="1197" y="877" font-family="Arial,sans-serif" font-size="18" fill="#2a4967" font-weight="500" text-anchor="start">+ 12    − 13    OUT 14</text><text x="184" y="924" font-family="Arial,sans-serif" font-size="17" fill="#a04335" font-weight="600" text-anchor="start">MOSFET TO-220 visto de frente: G - D - S (confirmar modelo). Tab metálico = D.</text></svg>